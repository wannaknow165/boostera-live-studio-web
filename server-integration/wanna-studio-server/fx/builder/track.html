<!doctype html>
<html><head><meta charset="utf-8"><title>Track reference</title></head>
<body style="background:#111;color:#ddd;font:14px monospace">
<div id="s">loading…</div>
<script type="module">
// Tracks the creator's face in a reference video, frame by frame, and saves track.json next to it.
// The green effect layer is aligned to this video, so this track tells the engine where the creator's head was in each frame.
// Usage: /builder/track.html?fx=raven-witch
import { FilesetResolver, FaceLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
const fxId = new URLSearchParams(location.search).get('fx');
const s = document.getElementById('s');
const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
const face = await FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: 'GPU' }, runningMode: 'IMAGE', numFaces: 1 });
const v = document.createElement('video'); v.muted = true; v.src = `/effects/${fxId}/reference.mp4`;
await new Promise(r => v.onloadeddata = r);
const fps = 24, n = Math.round(v.duration * fps), W = v.videoWidth, H = v.videoHeight;
const c = document.createElement('canvas'); c.width = W; c.height = H; const ctx = c.getContext('2d');
const frames = [];
for (let i = 0; i < n; i++) {
  v.currentTime = (i + 0.5) / fps; await new Promise(r => v.onseeked = r);
  ctx.drawImage(v, 0, 0, W, H);
  const lm = face.detect(c).faceLandmarks?.[0];
  if (lm) {
    // normalised coords (0..1) so they work at any layer resolution
    const P = k => [lm[k].x, lm[k].y], L = P(234), R = P(454), eL = P(33), eR = P(263);
    frames.push({ i, top: P(10), chin: P(152), eyes: [(lm[468].x + lm[473].x) / 2, (lm[468].y + lm[473].y) / 2], faceW: Math.hypot((R[0] - L[0]) * W, (R[1] - L[1]) * H) / W, roll: Math.atan2((eR[1] - eL[1]) * H, (eR[0] - eL[0]) * W) });
  } else frames.push({ i, none: true });
  if (i % 10 === 0) s.textContent = `frame ${i}/${n}`;
}
const track = { fps, width: W, height: H, frames };
const res = await fetch(`/save?name=track-${fxId}.json`, { method: 'POST', body: JSON.stringify(track) });
s.textContent = 'DONE ' + (await res.text()) + ' faces=' + frames.filter(f => !f.none).length + '/' + n;
window.trackDone = s.textContent;
</script></body></html>
